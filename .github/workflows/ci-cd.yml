name: Voting App CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vote image
        uses: docker/build-push-action@v6
        with:
          context: ./vote
          tags: voting-app-vote:${{ github.sha }}
          load: true

      - name: Build result image
        uses: docker/build-push-action@v6
        with:
          context: ./result
          tags: voting-app-result:${{ github.sha }}
          load: true

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          tags: voting-app-worker:${{ github.sha }}
          load: true

      - name: Scan vote image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: voting-app-vote:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '0'

      - name: Scan result image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: voting-app-result:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '0'

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: voting-app-worker:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '0'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SHA-tagged images to our registry
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          docker tag "voting-app-vote:$SHA" "$REGISTRY/voting-app-vote:$SHA"
          docker tag "voting-app-result:$SHA" "$REGISTRY/voting-app-result:$SHA"
          docker tag "voting-app-worker:$SHA" "$REGISTRY/voting-app-worker:$SHA"

          docker push "$REGISTRY/voting-app-vote:$SHA"
          docker push "$REGISTRY/voting-app-result:$SHA"
          docker push "$REGISTRY/voting-app-worker:$SHA"
